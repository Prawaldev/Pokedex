<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A minimal Pokédex — search Pokémon from the PokéAPI by name or number and view official artwork, types, abilities and base stats."
    />
    <title>Pokédex</title>

    <link rel="icon" href="/pokedex-favicon/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/pokedex-favicon/favicon.svg" />
    <link rel="icon" type="image/png" href="/pokedex-favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/pokedex-favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/pokedex-favicon/site.webmanifest" />
    <link rel="preload" href="/fonts/BrassMono/BrassMonoCode-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/BrassMono/BrassMonoCode-Bold.ttf" as="font" type="font/ttf" crossorigin />

    <script>
      // set the saved theme before first paint so the page never flashes
      (function () {
        try {
          var saved = localStorage.getItem('pokedex-theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved
          }
          var accent = localStorage.getItem('pokedex-accent')
          if (accent && /^#[0-9a-f]{6}$/i.test(accent)) {
            document.documentElement.style.setProperty('--accent', accent)
          }
        } catch (error) {
          /* private mode — keep the dark default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
